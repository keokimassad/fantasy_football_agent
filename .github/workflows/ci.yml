name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check test docstrings
        run: python tools/check_test_docstrings.py

      - name: Lint with Ruff
        run: python -m ruff check src tests scripts tools

      - name: Check Ruff formatting
        run: python -m ruff format --check src tests scripts tools

      - name: Type check with mypy
        run: python -m mypy src tests

      - name: Run tests with branch coverage
        run: |
          python -m pytest \
            --cov=fantasy_football_agent \
            --cov-branch \
            --cov-report=term-missing
